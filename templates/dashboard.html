<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fridge Inventory Dashboard</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.jpeg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Compact Header for 5" Display -->
    <nav class="navbar navbar-dark bg-orange sticky-top" style="padding: 2px 0; min-height: auto;">
        <div class="container-fluid" style="padding: 0 5px;">
            <span class="navbar-brand mb-0" style="font-size: 0.6rem; line-height: 1.2;">
                <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="Logo" style="height: 15px; margin-right: 3px; border-radius: 2px; vertical-align: middle;"> 
                Fridge
            </span>
            <div style="display: flex; gap: 2px;">
                <button class="btn btn-success btn-sm" onclick="openAddItemModal()" style="padding: 2px 6px; font-size: 0.5rem; line-height: 1;">
                    <i class="fas fa-plus" style="font-size: 0.5rem;"></i> Add Item
                </button>
                <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#qrModal" style="padding: 2px 4px; font-size: 0.5rem; line-height: 1;">
                    <i class="fas fa-qrcode" style="font-size: 0.5rem;"></i>
                </button>
                <button class="btn btn-success btn-sm" onclick="refreshData()" style="padding: 2px 4px; font-size: 0.5rem; line-height: 1;">
                    <i class="fas fa-sync-alt" style="font-size: 0.5rem;"></i>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- QR Code Modal -->
    <div class="modal fade" id="qrModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #ff914d; color: white;">
                    <h5 class="modal-title" style="color: white;">Scan QR Code</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center" style="padding: 30px;">
                    <img src="{{ url_for('static', filename='images/qr.png') }}" alt="QR Code" style="max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <p style="margin-top: 20px; color: #000000; font-weight: 500;">Scan to access your Fridge Inventory</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Volunteer Modal Overlay -->
    <div id="volunteerModal" class="add-item-modal" style="display: none;">
        <div class="add-item-modal-content">
            <div class="add-item-modal-header">
                <h5 class="mb-0" id="volunteer-modal-title"><i class="fas fa-user-plus"></i> Add Volunteer</h5>
                <button type="button" class="btn-close-modal" onclick="closeVolunteerModal()" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="add-item-modal-body">
                <form id="volunteer-form">
                    <input type="hidden" id="volunteer-id" value="">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="volunteer-name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="volunteer-email" required>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1" id="volunteer-submit-btn">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeVolunteerModal()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Item Modal Overlay -->
    <div id="addItemModal" class="add-item-modal" style="display: none;">
        <div class="add-item-modal-content">
            <div class="add-item-modal-header">
                <h5 class="mb-0"><i class="fas fa-plus-circle"></i> Add New Item</h5>
                <button type="button" class="btn-close-modal" onclick="closeAddItemModal()" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="add-item-modal-body">
                <form id="quick-add-form">
                    <div class="mb-3">
                        <label class="form-label">Item Name</label>
                        <input type="text" class="form-control" id="item-name" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="item-quantity" required>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="mb-3">
                                <label class="form-label">Unit</label>
                                <select class="form-select" id="item-unit" required>
                                    <option value="pieces">Pieces</option>
                                    <option value="kg">Kg</option>
                                    <option value="g">Grams</option>
                                    <option value="liters">Liters</option>
                                    <option value="packages">Packages</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="item-category">
                            <option value="">Select</option>
                            <option value="meat">🥩 Meat</option>
                            <option value="dairy">🥛 Dairy</option>
                            <option value="vegetables">🥬 Vegetables</option>
                            <option value="fruits">🍎 Fruits</option>
                            <option value="seafood">🐟 Seafood</option>
                            <option value="frozen">❄️ Frozen</option>
                            <option value="other">📦 Other</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" class="form-control" id="item-expiry">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" id="item-notes" rows="2"></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1">
                            <i class="fas fa-save"></i> Add to Fridge
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeAddItemModal()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="container-fluid" style="padding: 2px;">
        <!-- 5" Display - 2 Columns Layout -->
        <div class="horizontal-scroll-container">
            
            <!-- Section 1: Current Inventory -->
            <div class="scroll-section">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-boxes"></i> Current Inventory</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="inventory-list" class="inventory-scroll">
                            <!-- Items will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section 2: Right Column (Sensors + Volunteers) -->
            <div class="scroll-section">
                <div class="right-column-container">
                    <!-- Sensor Data (Compact) -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-chart-line"></i> Sensors</h5>
                        </div>
                        <div class="card-body">
                            <div class="sensor-grid-compact">
                                <!-- CO2 Level -->
                                <div class="sensor-card-compact">
                                    <div class="sensor-icon-compact bg-primary">
                                        <i class="fas fa-wind"></i>
                                    </div>
                                    <div class="sensor-info-compact">
                                        <div class="sensor-label-compact">CO2</div>
                                        <div class="sensor-value-compact" id="co2-value">--</div>
                                    </div>
                                </div>

                                <!-- Ammonia -->
                                <div class="sensor-card-compact">
                                    <div class="sensor-icon-compact bg-warning">
                                        <i class="fas fa-skull-crossbones"></i>
                                    </div>
                                    <div class="sensor-info-compact">
                                        <div class="sensor-label-compact">NH3</div>
                                        <div class="sensor-value-compact" id="ammonia-value">--</div>
                                    </div>
                                </div>

                                <!-- H2S Level -->
                                <div class="sensor-card-compact">
                                    <div class="sensor-icon-compact bg-danger">
                                        <i class="fas fa-biohazard"></i>
                                    </div>
                                    <div class="sensor-info-compact">
                                        <div class="sensor-label-compact">H2S</div>
                                        <div class="sensor-value-compact" id="h2s-value">--</div>
                                    </div>
                                </div>

                                <!-- Air Quality -->
                                <div class="sensor-card-compact">
                                    <div class="sensor-icon-compact bg-success">
                                        <i class="fas fa-leaf"></i>
                                    </div>
                                    <div class="sensor-info-compact">
                                        <div class="sensor-label-compact">Air</div>
                                        <div class="sensor-value-compact" id="air-quality-value">--</div>
                                    </div>
                                </div>

                                <!-- Door Status -->
                                <div class="sensor-card-compact">
                                    <div class="sensor-icon-compact bg-info">
                                        <i class="fas fa-door-open"></i>
                                    </div>
                                    <div class="sensor-info-compact">
                                        <div class="sensor-label-compact">Door</div>
                                        <div class="sensor-value-compact" id="door-status">--</div>
                                    </div>
                                </div>

                                <!-- Spoiled Items -->
                                <div class="sensor-card-compact">
                                    <div class="sensor-icon-compact bg-danger">
                                        <i class="fas fa-exclamation-triangle"></i>
                                    </div>
                                    <div class="sensor-info-compact">
                                        <div class="sensor-label-compact">Spoiled</div>
                                        <div class="sensor-value-compact" id="spoiled-count">0</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-2">
                                <small class="text-muted" id="sensor-timestamp">Updated: --</small>
                            </div>
                        </div>
                    </div>

                    <!-- Volunteers Section -->
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-users"></i> Volunteers</h5>
                            <button class="btn btn-success btn-sm" onclick="openAddVolunteerModal()" style="padding: 1px 4px; font-size: 0.45rem;">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="volunteers-list" class="volunteers-list">
                                <!-- Volunteers will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
